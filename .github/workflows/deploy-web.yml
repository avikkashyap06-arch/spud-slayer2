name: Build, Test, and Deploy Web Export

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot 4.3 with Export Templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Export Godot Web Build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html

      - name: Test Web Build in Headless Browser
        run: |
          python3 -m http.server 8080 -d build/web &
          sleep 2
          google-chrome --headless --no-sandbox --disable-gpu --enable-logging=stderr --v=1 --virtual-time-budget=5000 --screenshot=web_preview.png http://localhost:8080/index.html 2>&1 | grep -iE "CONSOLE|ERROR|Godot|WebGL|SharedArrayBuffer|exception|failed" || true

      - name: Upload Web Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-preview-screenshot
          path: web_preview.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
