name: Build, Test, and Deploy Web Export

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot 4.3 with Export Templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Export Godot Web Build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html

      - name: Test Web Build in Headless Browser
        run: |
          python3 -m http.server 8080 -d build/web &
          sleep 2
          python3 -c '
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(args=["--use-gl=angle", "--use-angle=swiftshader"])
              page = browser.new_page()
              page.on("console", lambda msg: print("PAGE LOG:", msg.type, msg.text))
              page.on("pageerror", lambda err: print("PAGE ERROR:", err))
              page.goto("http://localhost:8080/index.html", wait_until="networkidle")
              page.wait_for_timeout(4000)
              page.screenshot(path="web_preview.png")
              browser.close()
          '

      - name: Upload Web Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-preview-screenshot
          path: web_preview.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
