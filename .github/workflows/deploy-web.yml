name: Build and Deploy Web Export

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot 4.3 with Export Templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Auto-Fix main.gd for Web Export
        run: |
          python3 -c '
          import re
          p = "scripts/main.gd"
          s = open(p).read()
          s = re.sub(r"armor_tiers:\s*Array\s*=\s*$", "armor_tiers: Array = [0, 0, 0, 0, 0]", s, flags=re.M)
          s = re.sub(r"armor_tiers\s*=\s*$", "armor_tiers = [0, 0, 0, 0, 0]", s, flags=re.M)
          s = s.replace("parts\n", "parts[0]\n")
          s = s.replace("split(\",\")\n", "split(\",\")[0]\n")
          s = s.replace("runes = [bool(r), bool(r), bool(r), bool(r)]", "runes = [bool(r[0]), bool(r[1]), bool(r[2]), bool(r[3])]")
          s = s.replace("parsed.get(\"armor\",)", "parsed.get(\"armor\", [0, 0, 0, 0, 0])")
          s = s.replace("for bi in:", "for bi in [1, 4, 13, 20, 25, 28, 31, 37, 42, 46, 50]:")
          s = s.replace("for ph in:", "for ph in [1, 2]:")
          s = s.replace("tr.material = sm", "if not OS.has_feature(\"web\"): tr.material = sm")
          open(p, "w").write(s)
          '

      - name: Export Godot Web Build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
