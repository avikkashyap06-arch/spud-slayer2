name: Build and Deploy Web Export

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot 4.3 with Export Templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Move Root Scripts and Patch Web Rendering
        run: |
          mkdir -p scripts
          mv -f *.gd scripts/ 2>/dev/null || true
          python3 -c '
          import re
          p = "scripts/main.gd"
          s = open(p).read()
          s = re.sub(r"(\s+)add_child\(tr\)", r"\1if not OS.has_feature(\"web\"): add_child(tr)", s)
          s = re.sub(r"svp\.add_child\(world\)", r"(self if OS.has_feature(\"web\") else svp).add_child(world)", s)
          open(p, "w").write(s)
          '
          grep -n -C 3 "add_child(world)" scripts/main.gd

      - name: Export Godot Web Build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
