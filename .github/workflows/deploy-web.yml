name: Build and Deploy Web Export

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot 4.3 with Export Templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Organize Scripts and Patch for Web
        run: |
          mkdir -p scripts
          find . -maxdepth 3 -name "*.gd" ! -path "./scripts/*" -exec mv {} scripts/ \;
          python3 -c '
          import re
          L, R = chr(91), chr(93)
          p = "scripts/main.gd"
          s = open(p).read()
          s = re.sub(r"armor_tiers:\s*Array\s*=\s*$", f"armor_tiers: Array = {L}0, 0, 0, 0, 0{R}", s, flags=re.M)
          s = re.sub(r"armor_tiers\s*=\s*$", f"armor_tiers = {L}0, 0, 0, 0, 0{R}", s, flags=re.M)
          s = s.replace("parts\n", f"parts{L}0{R}\n")
          s = s.replace("split(\",\")\n", f"split(\",\"){L}0{R}\n")
          s = s.replace("runes = [bool(r), bool(r), bool(r), bool(r)]", f"runes = {L}bool(r{L}0{R}), bool(r{L}1{R}), bool(r{L}2{R}), bool(r{L}3{R}){R}")
          s = s.replace("parsed.get(\"armor\",)", f"parsed.get(\"armor\", {L}0, 0, 0, 0, 0{R})")
          s = s.replace("for bi in:", f"for bi in {L}1, 4, 13, 20, 25, 28, 31, 37, 42, 46, 50{R}:")
          s = s.replace("for ph in:", f"for ph in {L}1, 2{R}:")
          s = s.replace("tr.material = sm", "if not OS.has_feature(\"web\"): tr.material = sm")
          s = s.replace("world = Node2D.new(); svp.add_child(world)", "world = Node2D.new(); (self if OS.has_feature(\"web\") else svp).add_child(world)")
          open(p, "w").write(s)
          '

      - name: Export Godot Web Build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
